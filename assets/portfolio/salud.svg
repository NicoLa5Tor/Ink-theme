<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none" role="img" aria-label="Proyecto de salud">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1417"/><stop offset="1" stop-color="#070808"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.7"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#sbg)"/>
  <rect width="900" height="1200" fill="url(#sgrid)"/>
  <rect width="900" height="1200" fill="url(#sglow)"/>
  <!-- pulso / cruz motif -->
  <path d="M120 620 h180 l50 -120 l70 240 l50 -120 h290" stroke="#22d3ee" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="980" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="800" fill="#22d3ee" letter-spacing="4">SALUD</text>
  <text x="80" y="1050" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Campaña de generación</text>
  <text x="80" y="1100" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">de leads</text>
  <text x="80" y="130" font-family="Inter, Arial, sans-serif" font-size="26" fill="#525252">Ink Digital · placeholder</text>
</svg>
