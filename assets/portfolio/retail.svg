<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none" role="img" aria-label="Proyecto de retail">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1417"/><stop offset="1" stop-color="#070808"/>
    </linearGradient>
    <radialGradient id="rglow" cx="0.7" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.7"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#rbg)"/>
  <rect width="900" height="1200" fill="url(#rgrid)"/>
  <rect width="900" height="1200" fill="url(#rglow)"/>
  <!-- carrito / bolsas motif -->
  <g stroke="#22d3ee" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M300 560 h300 l-40 220 h-220 z"/>
    <path d="M360 560 v-40 a90 90 0 0 1 180 0 v40"/>
  </g>
  <text x="80" y="980" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="800" fill="#22d3ee" letter-spacing="4">RETAIL</text>
  <text x="80" y="1050" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Relanzamiento de marca</text>
  <text x="80" y="1100" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">y e-commerce</text>
  <text x="80" y="130" font-family="Inter, Arial, sans-serif" font-size="26" fill="#525252">Ink Digital · placeholder</text>
</svg>
