<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none" role="img" aria-label="Proyecto de gastronomía">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1417"/><stop offset="1" stop-color="#070808"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.4" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.7"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ggrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#gbg)"/>
  <rect width="900" height="1200" fill="url(#ggrid)"/>
  <rect width="900" height="1200" fill="url(#gglow)"/>
  <!-- tenedor + cuchillo motif -->
  <g stroke="#22d3ee" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 440 v130 a40 40 0 0 0 80 0 v-130 M400 440 v320"/>
    <path d="M520 440 c 70 0 70 150 0 170 v150"/>
  </g>
  <circle cx="450" cy="640" r="150" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="6" fill="none"/>
  <text x="80" y="980" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="800" fill="#22d3ee" letter-spacing="4">GASTRONOMÍA</text>
  <text x="80" y="1050" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Delivery y reservas</text>
  <text x="80" y="1100" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">online</text>
  <text x="80" y="130" font-family="Inter, Arial, sans-serif" font-size="26" fill="#525252">Ink Digital · placeholder</text>
</svg>
